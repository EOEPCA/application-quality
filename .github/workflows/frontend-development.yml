name: Frontend Development

on:
  push:
    branches: [ "frontend" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    defaults:
      run:
        working-directory: ./frontend
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: "Use Node.js ${{ matrix.node-version }}"
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: "Run tests"
      run: |
        npm config list
        npm install
        npm run test:list
        npm run test

  lint:
    name: Code standards
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    defaults:
      run:
        working-directory: ./frontend
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: "Use Node.js ${{ matrix.node-version }}"
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: "Lint code"
      run: |
        npm config list
        npm install
        npm run lint
    
    - name: "Format code"
      run: |
        npm run format

  build:
    name: App build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    defaults:
      run:
        working-directory: ./frontend
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: "Use Node.js ${{ matrix.node-version }}"
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm config list
        npm install --omit=dev
        # npx webpack
        npm run build
